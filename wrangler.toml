name = "authserver"
main = "src/worker.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[route]
pattern = "auth.nju.at/*"
zone_name = "210023.xyz"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "authserver"
database_id = "732b0ebf-cc3c-40da-b312-d16009a447d3"
migrations_dir = "migrations"
